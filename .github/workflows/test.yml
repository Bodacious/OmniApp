# .github/workflows/test.yml
#
# The minitest suites of the list-based apps that predate the stack
# matrix (sinatra_app/, rails_app/). The stack matrix, its unit tests
# and the domain purity checks are in stack-matrix.yml.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Run test with specific App framework
        app_name: [ sinatra, rails ]

    env:
      APP_NAME: ${{ matrix.app_name }}
      BUNDLE_WITHOUT: "" # optional; avoids surprises if you use groups

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake legacy_test
